<h2>Selecione os dias do evento</h2>

<div class="d-flex w-100 ">
  <app-multi-date-selector 
  class="w-50"
  (doubleClick)="abirModalDetalhe($event)"
  (selecaoChange)="pegarDias($event)"
  ></app-multi-date-selector>
  <div class="w-50">
    <app-smart-scheduling-form
    mode="evento"
    [dateArray]="datasSelecionadas"
    (batchSubmit)="salvarAgendamentos($event)"
    ></app-smart-scheduling-form>
  </div>
</div>

<app-schedule-day-modal
#scheduleModal
></app-schedule-day-modal>
