<div class="space-management-container">
  <h2 class="main-title">Lista de espaços Acadêmicos</h2>
  
  @if (mostrarFiltro) {
    <app-space-filter (filterChange)="onFilterChange($event)"></app-space-filter>
  } 

  <app-space-management-table
    [data]="displayedSalas"
    [currentPage]="currentPage"
    [totalPages]="totalPages"
    (searchChange)="onSearch($event)"
    (pageChange)="onPageChange($event)"
    (editSala)="onEditSala($event)"
    (deleteSala)="openDeleteModal($event)"
    (clickCriarRecurso)="criarEquipamento($event)"
    (filterToggle)="toggleFiltro()"
    class="w-100"
  >
  </app-space-management-table>
</div>

<app-create-resource-modal
  #criarRecursoId
  (create)="criarRecurso($event)"
></app-create-resource-modal>

<app-editar-espaco-modal #editModal (clickEdit)="onModalEdit($event)"> </app-editar-espaco-modal>

<app-confirmation-modal
  #confirmDeleteModal
  mode="aviso"
  title="Confirmar Delete"
  message="Você tem certeza que deseja deletar esta sala? Esta ação não pode ser desfeita."
  confirmText="Confirmar"
  cancelText="Cancelar"
  (onconfirm)="confirmDelete()"
  (oncancel)="closeModal()"
></app-confirmation-modal>

<app-add-item-modal #itemModal></app-add-item-modal>
