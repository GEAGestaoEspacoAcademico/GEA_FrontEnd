<div class="mt-2">
  <app-title-highligh title="Aulas"></app-title-highligh>
</div>

<div class="container my-3">
  <app-day-selector
      class="w-100 d-block"
      [currentMonthName]="monthToDisplay"
      [days]="days"
      [activeDayId]="activeDayId"
      (dayChange)="onDayChange($event)"
      (monthChange)="onMonthNavigate($event)"
      >
  </app-day-selector>

  <div class="mt-3">
    <app-class-info-card
      *ngFor="let agendamento of agendamentosDoDiaSelecionado$ | async"
      [classData]="agendamento"
      (delete)="requestCancelConfirmation($event)"
      (view)="handleViewAgendamento($event)"
    >
    </app-class-info-card>

    <div
      *ngIf="!(agendamentosDoDiaSelecionado$ | async)?.length && (loading$ | async) === false"
      class="text-secondary mt-3"
    >
      Sem aulas para este dia.
    </div>
  </div>

  <app-confirmation-modal
    #confirmModal
    [mode]="'aviso'"
    [title]="'Confirmar Cancelamento'"
    [message]="'Você tem certeza que deseja cancelar este agendamento? Esta ação não pode ser desfeita.'"
    [confirmText]="'Sim, cancelar'"
    [cancelText]="'Não'"
    (onConfirm)="confirmCancel()"
    (onCancel)="closeCancelModal()">
  </app-confirmation-modal>

  <app-romm-information-component [labData]="detalhes" [mode]="'detalhes'" ></app-romm-information-component>
</div>
