<div class="mt-2">
    <app-title-highligh title="Aulas"></app-title-highligh>
</div>

<div class="container my-3">
    <app-day-selector
    class="w-100 d-block"
    [days]="days"
    [activeDayId]="activeDayId"
    (dayChange)="onDayChange($event)">
  </app-day-selector>


  <div class="mt-3">
    <app-class-info-card
        *ngFor="let class of classesForSelectedDay"
        [classData]="class"
        (delete)="handleDeleteClass($event)"
        (view)="handleViewClass($event)">
    </app-class-info-card>

    <div *ngIf="!classesForSelectedDay?.length" class="text-secondary mt-3">
      Sem aulas para este dia.
    </div>
  </div>
</div>
