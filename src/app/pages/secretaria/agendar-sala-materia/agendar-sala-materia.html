<app-header></app-header>

<h1><b>Selecione o dia da aula</b></h1>

<div class="row">
  <div class="col-6">
    <app-multi-date-selector [modo]="'reccorente'" (selecaoChange)="onDaysSelected($event)" (diaDaSemana)="getDiaSemana($event)">
    </app-multi-date-selector>
  </div>
  <div class="col-6 mt-5">
    <app-recurring-scheduling-form [disciplinas]="this.disciplinas" [locais]="this.locais"
      [horarios]="this.horariosDisponiveis" [isLoading]="this.isLoadingHorarios">
    </app-recurring-scheduling-form>
  </div>

  <!-- <div class="lg:col-span-7 bg-white p-6 rounded-xl shadow-md border border-gray-200">
        <app-recurring-scheduling-form
          [disciplinas]="this.disciplinas"
          [locais]="this.locais"
          [horarios]="this.horariosDisponiveis" 
          [isLoading]="this.isLoadingHorarios"
          (scheduleSubmit)="onSchedule($event)">
        </app-recurring-scheduling-form>
      </div> -->

</div>

<!-- Loading Overlay (Enviando Agendamento) -->
@if (isSaving) {
<div class="absolute inset-0 bg-white bg-opacity-80 flex items-center justify-center z-50 rounded-xl">
  <div class="flex flex-col items-center">
    <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-700 rounded-full animate-spin mb-3"></div>
    <span class="text-blue-800 font-medium">Processando agendamento...</span>
  </div>
</div>
}
