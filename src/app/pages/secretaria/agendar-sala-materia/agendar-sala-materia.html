    <div class="p-4 bg-white border border-gray-200 rounded-xl shadow-sm">
      <h3 class="text-lg font-semibold text-gray-700 mb-3 flex items-center">
        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
        Datas Recorrentes
      </h3>
      <p class="text-sm text-gray-500 mb-4">Selecione os dias. A busca de horários baseia-se na <strong class="text-gray-700">primeira data</strong>.</p>
      
      <div class="flex flex-wrap gap-2">
        @for (date of mockDates; track date) {
          <button (click)="toggleDate(date)" 
                  type="button"
                  [class.bg-red-600]="isSelected(date)"
                  [class.text-white]="isSelected(date)"
                  [class.bg-gray-100]="!isSelected(date)"
                  [class.text-gray-700]="!isSelected(date)"
                  [class.hover:bg-red-100]="!isSelected(date)"
                  class="px-3 py-2 text-sm font-medium rounded-lg transition-colors duration-200 border border-transparent focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-1">
            {{ date | date:'dd/MM (EEE)' }}
          </button>
        }
      </div>
      
      <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wider">Selecionados</span>
        <span class="px-2 py-1 bg-red-50 text-red-700 text-xs font-bold rounded-md">
          {{ selectedDates.length }} dias
        </span>
      </div>
    </div>
