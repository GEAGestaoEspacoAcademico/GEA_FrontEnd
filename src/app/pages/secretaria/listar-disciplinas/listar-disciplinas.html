<div class="space-management-container">
  <h2 class="main-title">Lista de disciplinas</h2>
  <app-disciplinas-table
    [disciplinas]="(disciplinas$ | async) || []"
    [totalPages]="totalPages"
    [currentPage]="currentPage"
    [isLoading]="isLoading"
    [cursos]="cursos"
    (searchChange)="onSearch($event)"
    (pageChange)="onPageChange($event)"
    (editClick)="onEdit($event)"
    (deleteClick)="onDelete($event)"
    (selecionaCurso)="onSelecionaCurso($event)"
    (clickAdicionarEquipamento)="adicionarDisciplina()"
    >
  </app-disciplinas-table>
</div>

<app-confirmation-modal
  #deleteModal
  mode="aviso"
  title="Excluir Espaço"
  message="Tem certeza que deseja excluir este espaço? Esta ação não pode ser desfeita."
  (onconfirm)="confirmDelete()">
</app-confirmation-modal>
