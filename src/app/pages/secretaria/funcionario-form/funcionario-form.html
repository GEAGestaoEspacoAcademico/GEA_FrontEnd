<form [formGroup]="form" class="container py-4 funcionario-form">

  <div class="row">
    <div class="col-md-6">

      <h3 class="section-title">Cadastrar Funcionário</h3>

      <div class="mb-4">
        <div class="d-flex align-items-center gap-4 perfil-group">
          <label class="radio-label">
            <input type="radio" formControlName="perfil" value="PROFESSOR" />
            Professor
          </label>
          <label class="radio-label">
            <input type="radio" formControlName="perfil" value="SECRETARIA" />
            Secretaria
          </label>
          <label class="radio-label">
            <input type="radio" formControlName="perfil" value="AUXILIAR_DOCENTE" />
            Aux. Admin.
          </label>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label field-label">Nome completo</label>
        <input type="text" class="form-control" formControlName="nomeCompleto" placeholder="Digite o nome completo" />
      </div>

      <div class="mb-3">
        <label class="form-label field-label">E-mail</label>
        <input type="email" class="form-control" formControlName="email" placeholder="Digite o email" />
      </div>

      <div class="mb-3">
        <label class="form-label field-label">Registro</label>
        <input type="text" class="form-control" formControlName="registro" placeholder="Digite o Registro" />
      </div>

      <div class="d-flex gap-3 mt-4">
        <button class="btn btn-danger px-4" type="button"
                [disabled]="!form.valid || isLoading"
                (click)="onSave()">
          SALVAR
        </button>

        <button class="btn btn-outline-danger px-4" type="button"
                [disabled]="isLoading"
                (click)="onCancel()">
          CANCELAR
        </button>
      </div>

    </div>

    <div class="col-md-6" *ngIf="form.get('perfil')?.value === 'PROFESSOR'">
      <h4 class="section-title">Disciplinas</h4>

      <div class="disciplinas-box border rounded p-3">
        <div class="d-flex flex-wrap gap-2 mb-3">
          <span *ngFor="let disc of disciplinas.controls; let i = index"
                class="disc-pill">
            {{ disc.value }}
            <button type="button" class="btn-close btn-close-white ms-2"
                    (click)="removeDisciplina(i)"></button>
          </span>
        </div>

        <button type="button"
                class="btn btn-danger w-100 d-flex align-items-center justify-content-center gap-2"
                (click)="abrirModalDisciplina()">
          <i class="bi bi-plus-circle"></i> Adicionar Disciplina
        </button>
      </div>
    </div>
  </div>

</form>

<div *ngIf="modalDisciplinaAberto" class="modal-overlay">
  <div class="modal-content-box">
    <h5>Nova Disciplina</h5>

    <input type="text" class="form-control mt-3"
           [(ngModel)]="disciplinaTemp" />

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button class="btn btn-outline-secondary" (click)="modalDisciplinaAberto = false">Cancelar</button>
      <button class="btn btn-danger" (click)="confirmarDisciplina()">Adicionar</button>
    </div>
  </div>
</div>
