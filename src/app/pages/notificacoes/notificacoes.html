<div class="notification-container">
  <app-title-highlightt title="Notificações"></app-title-highlightt>
  <app-notification-card
    *ngFor="let notificacao of notificacoes"
    [source]="notificacao.source"
    [title]="notificacao.title"
    [date]="notificacao.date"
    [snippet]="notificacao.snippet"
  ></app-notification-card>
</div>

<app-add-item-modal></app-add-item-modal>
