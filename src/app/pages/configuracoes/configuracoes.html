<div class="d-flex flex-column gap-3 color">
  <div class="container">
    <div class="mt-2">
      <app-title-highligh title="Configurações"></app-title-highligh>
    </div>
      <div class="d-flex flex-column">
        <div class="d-flex flex-row">
          <div class="line mt-3"></div>
          <a class="subtitle p-1" routerLink="/agenda">Alterar Senha</a>
        </div>
        <div class="d-flex flex-row">
          <div class="line mt-3"></div>
          <a tabindex="0" class="subtitle p-1" routerLink="/login" (click)="logout()" (keypress)="logout()">Logout</a>
          <mat-icon svgIcon="logout" class="icon-logout"></mat-icon>
        </div>
      </div>
    </div>
  </div>
  <div class="container informations">
    <app-title-highligh title="Informações"></app-title-highligh>
    <dl>
      <div class="d-flex flex-row gap-1">
        <dt>Nome:</dt>
        <dd>{{mockTeacher.nome}}</dd>
      </div>

      <dt>Disciplinas:</dt>
      <dd>
        <ul>  
          @for (disciplina of mockTeacher.disciplinas; track $index) {
            <li>{{disciplina}}</li>
          }
        </ul>
      </dd>

      <dt>Cursos e semestres:</dt>
      <dd>
        <ul>
          @for (curso of mockTeacher.cursos; track $index) {
            <li>{{curso.curso}} - {{curso.semestre}} - {{curso.disciplina}}</li>
          }
        </ul>
      </dd>
    </dl>
  </div>
