<section class="space-table-container" aria-labelledby="espacos-title">
  <header class="table-header">
    <div class="header-controls">
      <form class="search-bar" role="search" (submit)="$event.preventDefault()">
        <label for="searchInput" class="visually-hidden">Buscar pelo nome</label>
        <mat-icon class="icon-search" svgIcon="search"></mat-icon>
        <input
          id="searchInput"
          type="search"
          name="search"
          [(ngModel)]="searchTerm"
          (input)="onSearchChange()"
          placeholder="Buscar pelo nome... "
          aria-label="Buscar pelo nome do espaço"
        />

        <button
          type="button"
          aria-label="Aplicar Opções de Filtro da Busca"
          (click)="toggleFiltro()"
        >
          <mat-icon class="icon-filter" svgIcon="filter"></mat-icon>
        </button>
      </form>
    </div>
  </header>

  <div class="table-wrapper" role="region" aria-labelledby="espacos-title" tabindex="0">
    <table class="space-table">
      <thead>
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">Piso</th>
          <th scope="col">Tipo de Espaço</th>
          <th scope="col">Disponível</th>
          <th scope="col">Ações</th>
        </tr>
      </thead>
      <tbody>
        @for (sala of data; track sala?.salaId ?? sala.salaNome ?? $index) {
          <tr>
            <td>{{ sala.salaNome }}</td>
            <td>{{ sala.piso }}</td>
            <td>{{ sala.tipoSala }}</td>
            <td>{{ sala.disponibilidade ? 'Sim' : 'Não'}}</td>
            <td class="actions">
              <button
                type="button"
                class="edit-btn"
                (click)="onEdit(sala)"
                aria-label="Editar {{ sala.salaNome }}"
              >
                <mat-icon svgIcon="edit" aria-hidden="true"></mat-icon>
                <span class="visually-hidden">Editar</span>
              </button>
              <button
                type="button"
                class="delete-btn"
                (click)="onDelete(sala)"
                aria-label="Excluir {{ sala.salaNome }}"
              >
                <mat-icon svgIcon="delete" aria-hidden="true"></mat-icon>
                <span class="visually-hidden">Excluir</span>
              </button>
            </td>
          </tr>
        }
        @if (data.length === 0) {
          <tr>
            <td colspan="5" class="no-data" role="status">Nenhum espaço encontrado.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <nav class="pagination" aria-label="Navegação de páginas" role="navigation">
    <button
      type="button"
      (click)="goToPage(currentPage - 1)"
      [disabled]="currentPage === 1"
      aria-label="Página anterior"
    >
      &lt;
    </button>

    <button
      type="button"
      (click)="goToPage(currentPage)"
      aria-label="Página atual {{ currentPage }}"
      class="active"
    >
      {{ currentPage }}
    </button>

    <button
      type="button"
      (click)="goToPage(currentPage + 1)"
      [disabled]="currentPage === totalPages"
      aria-label="Próxima página"
    >
      &gt;
    </button>
  </nav>
</section>
