<section class="space-table-container" aria-labelledby="espacos-title">
  <header class="table-header">
    <div class="header-controls">
      <div class="filter d-flex gap-4">
        <form class="search-bar" role="search" (submit)="$event.preventDefault()">
          <label for="searchInput" class="visually-hidden">Buscar pelo nome</label>
          <mat-icon class="icon-search" svgIcon="search"></mat-icon>
          <input
            id="searchInput"
            type="search"
            name="search"
            [(ngModel)]="searchTerm"
            (input)="onSearchChange()"
            placeholder="Buscar pelo nome da disciplina"
            aria-label="Buscar pelo nome da disciplina"
          />

          <button type="button" aria-label="Aplicar Opções de Filtro da Busca">
            <mat-icon class="icon-filter" svgIcon="filter"></mat-icon>
          </button>
        </form>

        <select class="form-select" aria-label="Selecione um semestre para filtrar">
          <option selected>Selecione o semestre</option>
          <option value="1">1° semestre</option>
          <option value="2">2° semestre</option>
          <option value="3">3° semestre</option>
          <option value="4">4° semestre</option>
          <option value="5">5° semestre</option>
          <option value="6">6° semestre</option>
        </select>

        <select
          class="form-select"
          aria-label="Selecione um curso para filtrar"
          [(ngModel)]="cursoSelecionado"
          (ngModelChange)="emitirSelecao()"
        >
          <option [ngValue]="null">Selecione o curso</option>
          @for (curso of cursos; track curso.cursoId) {
            <option [ngValue]="curso.cursoNome">{{ curso.cursoNome }}</option>
          }
        </select>
      </div>

      <div class="actions-buttons">
        <button type="button" class="add-btn" (click)="adicionarDisciplina()">
          <mat-icon>add_circle_outline</mat-icon>
          Nova Disciplina
        </button>
      </div>
    </div>
  </header>

  <section class="table-wrapper" aria-labelledby="espacos-title">
    <table class="space-table">
      <thead>
        <tr>
          <th scope="col">Nome</th>
          <th scope="col">Semestre</th>
          <th scope="col">Curso</th>
          <th scope="col">Ações</th>
        </tr>
      </thead>
      <tbody>
        @if (disciplinas.length === 0) {
          <tr>
            <td colspan="5" class="no-data">Nenhuma disciplina encontrada.</td>
          </tr>
        } @else {
          @for (disciplina of disciplinas; track disciplina.disciplinaId) {
            <tr>
              <td>{{ disciplina.disciplinaNome }}</td>
              <td>{{ disciplina.disciplinaSemestre }}</td>
              <td>{{ disciplina.cursoNome }}</td>
              <td class="actions">
                <button
                  type="button"
                  class="edit-btn"
                  (click)="onEdit(disciplina)"
                  aria-label="Editar {{ disciplina.disciplinaNome }}"
                >
                  <mat-icon svgIcon="edit" aria-hidden="true"></mat-icon>
                  <span class="visually-hidden">Editar</span>
                </button>
                <button
                  type="button"
                  class="delete-btn"
                  (click)="onDelete(disciplina)"
                  aria-label="Excluir {{ disciplina.disciplinaNome }}"
                >
                  <mat-icon svgIcon="delete" aria-hidden="true"></mat-icon>
                  <span class="visually-hidden">Excluir</span>
                </button>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
  </section>

  <nav class="pagination" aria-label="Navegação de páginas" role="navigation">
    <button
      type="button"
      (click)="goToPage(currentPage - 1)"
      [disabled]="currentPage === 1"
      aria-label="Página anterior"
    >
      &lt;
    </button>

    <button
      type="button"
      (click)="goToPage(currentPage)"
      aria-label="Página atual {{ currentPage }}"
      class="active"
    >
      {{ currentPage }}
    </button>

    <button
      type="button"
      (click)="goToPage(currentPage + 1)"
      [disabled]="currentPage === totalPages"
      aria-label="Próxima página"
    >
      &gt;
    </button>
  </nav>
</section>
