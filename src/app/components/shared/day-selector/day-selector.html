<section class="calendar-container" role="region" aria-label="Calendário mensal">

  <header class="month-selector" role="banner" aria-label="Navegação do mês">
    <button class="nav-arrow" type="button" (click)="navigateMonth('previous')" aria-label="Mês anterior">
      <mat-icon svgIcon="arrow-back" class="arrow-icon"></mat-icon>
    </button>

    <span class="month-name" aria-live="polite">{{ currentMonthName }}</span>

    <button class="nav-arrow" type="button" (click)="navigateMonth('next')" aria-label="Próximo mês">
      <mat-icon svgIcon="arrow-previus" class="arrow-icon"></mat-icon>
    </button>
  </header>

  <div
    class="day-selector-wrapper"
    [class.show-left-fade]="showLeftFade"
    [class.show-right-fade]="showRightFade"
  >
    <nav
      #daySelector
      class="day-selector d-flex gap-2 overflow-auto py-2"
      (scroll)="onScroll($event)"
      role="navigation"
      aria-label="Seleção de dias"
    >
      <button
        *ngFor="let day of days"
        type="button"
        class="day-item text-center p-2 rounded"
        [ngClass]="{
          'active text-danger fw-bold border border-danger': day.id === activeDayId,
          'text-secondary': day.id !== activeDayId,
          'disable': day.id < currentDay,
          'border border-danger': temAgendamento(day) && day.id !== activeDayId
        }"
        (click)="selectDay(day.id)"
        [attr.aria-pressed]="day.id === activeDayId"
        [attr.aria-current]="day.id === activeDayId ? 'date' : null"
      >
        <div class="day-date fs-5">{{ day.date }}</div>
        <div class="day-week text-lowercase">{{ day.dayOfWeek }}</div>

        @if(temAgendamento(day)) {
          <span class="badge bola rounded-circle p-1 d-block mx-auto mt-1" style="width: 6px; height: 6px;"></span>
        }
      </button>
    </nav>
  </div>
</section>
