    <div class="collapsed-card btn btn-light d-flex justify-content-between align-items-center" (click)="openModal()">
        <span><strong>{{ labData?.nome }}</strong></span>
        <i class="bi bi-arrow-right"></i>
    </div>

    <!-- Modal -->
    <div class="modal fade show" tabindex="-1" *ngIf="showModal"
        style="display: block; background-color: rgba(0,0,0,0.5);">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0">
                <div class="modal-header bg-dark-red text-white justify-content-between">
                    <h5 class="modal-title">Detalhes</h5>
                    <button type="button" class="btn-close btn-close-white" (click)="closeModal()"></button>
                </div>
                <div class="modal-body text-center">
                    <p class="fw-semibold">{{ labData.nome }}</p>
                    <hr>
                    <p>{{ labData.data }}</p>
                    <hr>
                    <p>{{ labData.horario }}</p>
                    <hr>
                    <p>{{ labData.capacidade }}</p>
                    <hr>
                    <p class="text-danger fw-semibold">Observações</p>
                    <hr>
                    <div *ngFor="let obs of labData.observacoes">
                        <p>{{ obs }}</p>
                    </div>
                </div>
                <div class="modal-footer d-flex justify-content-center">
                    <button class="btn btn-dark-red text-white" (click)="confirmSchedule()">Agendar</button>
                </div>
            </div>
        </div>
    </div>
