<header
  class="container-fluid text-white fs-3 d-flex justify-content-between align-items-center header"
  role="banner"
>
  <a class="logo p-2" routerLink="/aulas" aria-label="Ir para Aulas">
    <mat-icon svgIcon="icon-fatec" class="icon-fatec-big" aria-hidden="true"></mat-icon>
    <span class="visually-hidden">Fatec — Aulas</span>
  </a>

  <div class="header-dynamic-content" *ngIf="userCargo$ | async as cargo">
    <div class="header-center-content">
      <nav
        class="nav-links"
        *ngIf="(cargo ?? '') === 'PROFESSOR'"
        aria-label="Navegação principal"
      >
        <a
          routerLink="/aulas"
          routerLinkActive="active-link"
          #rlaAulas="routerLinkActive"
          [attr.aria-current]="rlaAulas.isActive ? 'page' : null"
          class="nav-item"
        >
          Aulas
        </a>

        <a
          routerLink="/agenda"
          routerLinkActive="active-link"
          #rlaAgenda="routerLinkActive"
          [attr.aria-current]="rlaAgenda.isActive ? 'page' : null"
          class="nav-item"
        >
          Agendar
        </a>

        <a
          routerLink="/configuracoes"
          routerLinkActive="active-link"
          #rlaConfig="routerLinkActive"
          [attr.aria-current]="rlaConfig.isActive ? 'page' : null"
          class="nav-item"
        >
          Configurações
        </a>
      </nav>

      <h2
        class="page-title"
        *ngIf="(cargo ?? '') === 'AD' || (cargo ?? '') === 'SECRETARIA'"
        aria-live="polite"
      >
        {{ title$ | async }}
      </h2>
    </div>

    <div class="header-right-icons" role="group" aria-label="Ações do cabeçalho">
      <a
        class="notification"
        routerLink="/notificacoes"
        routerLinkActive="active"
        #rla="routerLinkActive"
        aria-label="Ir para Notificações"
        [attr.aria-current]="rla.isActive ? 'page' : null"
      >
        <mat-icon
          [svgIcon]="rla.isActive ? 'notification-fill' : 'notification'"
          class="icon-notification-medium"
          aria-hidden="true"
        ></mat-icon>
        <span class="visually-hidden">Notificações</span>
      </a>

      <a
        *ngIf="(cargo ?? '') === 'AD' || (cargo ?? '') === 'SECRETARIA'"
        (click)="logout()"
        (keydown.enter)="logout()"
        class="logout-button"
        aria-label="Sair"
        tabindex="0"
        role="button"
      >
        <mat-icon svgIcon="logout" class="icon-logout-medium" aria-hidden="true"></mat-icon>
        <span class="visually-hidden">Sair</span>
      </a>
    </div>
  </div>
</header>
