    <div class="min-h-screen bg-gray-50 font-sans text-gray-800 p-6">
      <main class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <div class="lg:col-span-4 space-y-4">
          <app-agendar-sala-materia (recurringDaysSelect)="onDaysSelected($event)"></app-agendar-sala-materia>
          
          <div [class]="statusClass()" class="p-4 rounded-lg border text-sm">
             {{ statusMessage() }}
          </div>
        </div>

        <div class="lg:col-span-8 bg-white p-4 rounded-xl shadow-sm border border-gray-200">
          
          <!-- 
             ATENÇÃO: Removido os parênteses '()' dos bindings
             porque agora são variáveis normais, não signals
          -->
          <app-recurring-scheduling-form
            #scheduleForm
            [disciplinas]="this.disciplinas"
            [locais]="this.locais"
            [horarios]="this.horariosDisponiveis" 
            (scheduleSubmit)="onSchedule($event)">
          </app-recurring-scheduling-form>

        </div>
      </main>
    </div>
